version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/actual.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: actual

build:
  run_buildscript: false

images:
  - id: actual
    target: service
    service: actual
    source: actualbudget/actual-server
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Actual
    summary: "本地优先的个人财务管理应用"
